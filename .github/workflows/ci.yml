name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      # Per-route bundle size against docs/bundle-baseline.json (Phase 2.5 R0): fails when a route's JS or CSS grew by more than 5 kB.
      # Same placeholders as the build, so the inlined values match the baseline's.
      - name: Bundle size (compare with docs/bundle-baseline.json)
        run: npm run report:bundle -- --compare docs/bundle-baseline.json --max-growth-kb 5
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      # Fails when the number of lint errors or warnings is higher than lint-baseline.json; says so when it is lower.
      # The existing errors are cleared in Phase 2.5 R5 and Phase 3; until then none may be added.
      - name: Lint (ratchet)
        run: npm run lint:ratchet
      # Which folder may import which, and no import cycles (docs/ARCHITECTURE.md, "Dependency rules"). The ratchet runs the same
      # check; this step also runs its selftest, which proves each rule still catches its violation.
      - name: Import boundaries (with selftest)
        run: npm run lint:boundaries:selftest

  # Every table, column, RPC, enum value and bucket the frontend uses exists in the migrated database, and the frontend
  # only writes what role `authenticated` may write (scripts/contract-check, docs/CONTRACT_CHECK.md). The selftest
  # proves the check still catches each kind of break.
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL 16
        run: |
          if ! ls /usr/lib/postgresql/16/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi
      - name: Contract check (with selftest)
        run: npm run test:contract:selftest
      # lib/database.types.ts is generated from the database (docs/ARCHITECTURE.md). Fails when a table, column, enum or
      # function of the migrations differs from it, so a migration without regenerated types cannot merge.
      - name: Types drift (with selftest)
        run: npm run test:types-drift:selftest

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          if ! ls /usr/lib/postgresql/16/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi
      - name: Replay migrations and run SQL tests
        run: scripts/db-replay.sh
